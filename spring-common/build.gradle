plugins {
    id 'java-library'
    id 'maven-publish'
    id 'io.spring.dependency-management'
}

group = 'com.onevour.core'
version = '2.0.3'

java {
    sourceCompatibility = JavaVersion.VERSION_11
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/onevour/spring-commons")
            credentials {
                username = project.findProperty("user") ?: System.getenv("USERNAME")
                password = project.findProperty("token") ?: System.getenv("TOKEN")
            }
        }
    }
    publications {
        gpr(MavenPublication) {
            from(components.java)
            // versi di POM diambil dari hasil resolusi build ini (versi biasa, bukan strict),
            // jadi BOM milik pemakai tetap bisa menimpanya
            versionMapping {
                usage("java-api") {
                    fromResolutionResult()
                }
                usage("java-runtime") {
                    fromResolutionResult()
                }
            }
        }
    }
}

// BOM hanya dipakai untuk me-resolve versi saat build library ini.
// generatedPomCustomization dimatikan supaya BOM TIDAK ikut terbit di POM
// dan library ini tidak mengunci versi dependency di proyek pemakai.
dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${versions.springBoot}"
    }
    dependencies {
        dependency "joda-time:joda-time:${versions.joda}"
        dependency "commons-io:commons-io:${versions.commonsIO}"
        dependency "org.apache.commons:commons-lang3:${versions.commonsLang}"
        dependency "org.apache.httpcomponents:httpclient:${versions.httpClient}"
    }
    generatedPomCustomization {
        enabled = false
    }
}

dependencies {
    // springframework
    api "org.springframework:spring-context"
    api "org.springframework:spring-beans"
    api "org.springframework:spring-aop"
    api "org.springframework:spring-web"

    // springframework boot
    api "org.springframework.boot:spring-boot-autoconfigure"

    // aop
    api "com.fasterxml.jackson.core:jackson-databind"
    api "javax.validation:validation-api"
    api "org.aspectj:aspectjweaver"
    api "org.slf4j:slf4j-api"

    // commons
    api 'joda-time:joda-time'
    api 'commons-io:commons-io'
    api 'org.apache.commons:commons-lang3'
    api 'org.apache.httpcomponents:httpclient'

    compileOnly "javax.servlet:javax.servlet-api"
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

}

tasks.named('test') {
    useJUnitPlatform()
}

