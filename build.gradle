plugins {
    id 'org.springframework.boot' version '2.7.17' apply false
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

ext.versions = [
        springBoot: '2.7.17',
        commonsCodec: '1.15',
        commonsIO: '2.14.0',
        commonsLang: '3.12.0',
        httpClient: '4.5.13',
        joda: '2.12.5',
        lombok: '1.18.2',
        minio: '8.5.14',
]

