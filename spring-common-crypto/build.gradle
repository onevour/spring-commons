plugins {
    id 'java-library'
    id 'maven-publish'
    id 'io.spring.dependency-management'
}

group = 'com.onevour.core'
version = '2.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_11
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/onevour/spring-commons")
            credentials {
                username = project.findProperty("user") ?: System.getenv("USERNAME")
                password = project.findProperty("token") ?: System.getenv("TOKEN")
            }
        }
    }
    publications {
        gpr(MavenPublication) {
            from(components.java)
            // versi di POM diambil dari hasil resolusi build ini (versi biasa, bukan strict),
            // jadi BOM milik pemakai tetap bisa menimpanya
            versionMapping {
                usage("java-api") {
                    fromResolutionResult()
                }
                usage("java-runtime") {
                    fromResolutionResult()
                }
            }
        }
    }
}

// BOM hanya dipakai untuk me-resolve versi saat build library ini.
// generatedPomCustomization dimatikan supaya BOM TIDAK ikut terbit di POM
// dan library ini tidak mengunci versi dependency di proyek pemakai.
dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${versions.springBoot}"
    }
    dependencies {
        dependency "commons-codec:commons-codec:${versions.commonsCodec}"
        dependency "io.minio:minio:${versions.minio}"
    }
    generatedPomCustomization {
        enabled = false
    }
}

dependencies {
    api "org.slf4j:slf4j-api"
    api "commons-codec:commons-codec"
    api "io.minio:minio"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // test
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "org.mockito:mockito-inline:4.5.1"
    testImplementation 'org.projectlombok:lombok'
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'

}

tasks.named('test') {
    useJUnitPlatform()
}